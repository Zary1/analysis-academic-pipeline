
analysis_academic:
  target: dev

  outputs:
    dev:
      type: sqlserver
      driver: "ODBC Driver 17 for SQL Server"
      server: "{{ env_var('MSSQL_HOST', 'localhost') }}"
      port: "{{ env_var('MSSQL_PORT', '1434') | as_number }}"
      database: "analysis_academic"
      schema: "raw"
      user: sa
      password: "{{ env_var('MSSQL_PASSWORD') }}"
      encrypt: true
      trust_cert: true

      threads: 4
